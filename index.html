<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartshots Desktop</title>
  </head>
  <body>
    <div class="app-shell">
      <h1 class="heading">Smartshots Desktop</h1>
      <div class="status-stack">
        <p class="status" id="auth-status">Auth: checking...</p>
        <p class="status" id="watcher-status">Watcher: stopped</p>
        <p class="status" id="upload-status">Uploads: idle</p>
      </div>

      <div class="row">
        <button id="signin-btn">Sign in with Google</button>
        <button id="signout-btn" class="secondary">Sign out</button>
      </div>

      <div class="row">
        <button id="watcher-btn">Start watcher</button>
      </div>

      <div class="row">
        <label>
          <input id="notifications-toggle" type="checkbox" />
          Enable system notifications
        </label>
      </div>

      <div class="row">
        <label>
          <input id="watcher-autostart-toggle" type="checkbox" />
          Auto-start watcher after app launch
        </label>
      </div>

      <p class="section-title">Default screenshot directories</p>
      <ul id="dirs-list"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
