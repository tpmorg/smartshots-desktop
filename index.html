<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartshots Desktop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "SF Pro Text", "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: linear-gradient(145deg, #f5f8ff 0%, #eef4ff 50%, #edf8f2 100%);
      }
      .card {
        max-width: 640px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #d5e0f8;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 16px 30px rgba(22, 38, 75, 0.1);
      }
      h1 {
        margin-top: 0;
        font-size: 20px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        background: #0a63ff;
        color: #fff;
        font-weight: 600;
      }
      button.secondary {
        background: #d9e6ff;
        color: #14356f;
      }
      .status {
        font-size: 14px;
        color: #29436a;
      }
      code {
        font-size: 12px;
        background: #f1f5ff;
        border-radius: 6px;
        padding: 2px 5px;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Smartshots Desktop</h1>
      <p class="status" id="auth-status">Auth: checking...</p>
      <p class="status" id="watcher-status">Watcher: stopped</p>
      <p class="status" id="upload-status">Uploads: idle</p>

      <div class="row">
        <button id="signin-btn">Sign in with Google</button>
        <button id="signout-btn" class="secondary">Sign out</button>
      </div>

      <div class="row">
        <input
          id="callback-url-input"
          type="text"
          placeholder="Paste smartshots://auth/callback URL (dev fallback)"
          style="flex: 1; min-width: 280px; border: 1px solid #c7d5f5; border-radius: 10px; padding: 10px;"
        />
        <button id="apply-callback-btn" class="secondary">Apply callback</button>
      </div>

      <div class="row">
        <button id="watcher-btn">Start watcher</button>
      </div>

      <div class="row">
        <label>
          <input id="notifications-toggle" type="checkbox" />
          Enable system notifications
        </label>
      </div>

      <p class="status">Default screenshot directories:</p>
      <ul id="dirs-list"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
